name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

# Skip duplicate jobs on PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The coverage summary as a comment on the pull request.
      pull-requests: write
    # Real PostgreSQL for the tests that need concurrent connections.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./tooling/github/setup

      - name: No ignored files in git
        run: test -z "$(git ls-files -ci --exclude-standard)"

      - name: Install Chromium for the story tests
        run: pnpm -F @repo/ui exec playwright install --with-deps chromium

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Dependency Cruiser (package boundaries, circular imports)
        run: pnpm depcruise

      - name: Knip (unused files, dependencies, exports)
        run: pnpm knip

      - name: Migrations match the Drizzle schema
        run: |
          DATABASE_URL=postgresql://unused@localhost/unused pnpm -F @repo/db exec drizzle-kit generate
          git diff --exit-code packages/db/drizzle
          test -z "$(git status --porcelain packages/db/drizzle)"

      - name: Build
        run: pnpm build

      - name: Storybook build
        run: pnpm -F @repo/ui build-storybook --quiet

      - name: Unit tests with coverage
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm test:unit:coverage

      - name: Keep the screenshots of failed story tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: story-screenshots
          path: packages/ui/.vitest
          retention-days: 7

      - name: CRAP score report
        # Report-only: complexity × missing coverage, derived from the
        # coverage-final.json files the previous step just wrote. Does not
        # gate the build (see tooling/quality/crap-score.mjs).
        continue-on-error: true
        run: pnpm crap

      - name: Collect non-empty cobertura reports
        id: cov
        run: |
          files=$(grep -l '<package ' apps/*/coverage/cobertura-coverage.xml packages/*/coverage/cobertura-coverage.xml 2>/dev/null | paste -sd, -)
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Code coverage summary
        if: steps.cov.outputs.files != ''
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: ${{ steps.cov.outputs.files }}
          badge: true
          format: markdown
          output: both

      - name: Coverage comment on the pull request
        # Pull requests from forks get a read-only token.
        if: >-
          github.event_name == 'pull_request' && steps.cov.outputs.files != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: code-coverage-results.md

  # The web app against the real API and a fresh database.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./tooling/github/setup

      - name: Install Chromium for Playwright
        run: pnpm -F @repo/e2e exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm test:e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  # Builds the image, so a broken Dockerfile is found before the merge.
  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container answers /health and stops at once on SIGTERM
        # tini passes SIGTERM on to Node.js. Without it, Node.js as PID 1
        # ignores the signal and is killed after the timeout (exit code 137).
        # /health answers without a database; the values are placeholders.
        run: |
          docker run --detach --name app --publish 3000:3000 \
            --env DATABASE_URL=postgresql://unused@127.0.0.1:1/unused \
            --env BETTER_AUTH_SECRET=placeholder-secret-for-the-stop-test-only \
            --env BETTER_AUTH_URL=http://localhost:3000 \
            app:ci
          for _ in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://localhost:3000/health; then break; fi
            sleep 1
          done
          if ! curl --silent --fail --output /dev/null http://localhost:3000/health; then
            docker logs app
            echo "::error::The container did not answer on port 3000."
            exit 1
          fi
          curl --silent --fail --output /dev/null http://localhost:3000/ || {
            echo "::error::The container does not serve the SPA."
            exit 1
          }
          start=$(date +%s%N)
          docker stop --time 5 app
          elapsed_ms=$(( ($(date +%s%N) - start) / 1000000 ))
          code=$(docker inspect app --format '{{.State.ExitCode}}')
          docker logs app
          echo "Stopped after ${elapsed_ms} ms with exit code ${code}."
          if [ "${elapsed_ms}" -ge 4000 ]; then
            echo "::error::docker stop took ${elapsed_ms} ms. The container ignores SIGTERM."
            exit 1
          fi
          if [ "${code}" != "0" ] && [ "${code}" != "143" ]; then
            echo "::error::The container ended with exit code ${code}, expected 0 or 143."
            exit 1
          fi

  security:
    name: Secrets and workflows
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans every commit, not only the last one.
          fetch-depth: 0
          persist-credentials: false

      - name: Secrets in the history (gitleaks)
        run: |
          curl --silent --show-error --fail --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

      - name: Workflow syntax (actionlint)
        run: |
          curl --silent --show-error --fail --location --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Workflow security (zizmor)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          config: .github/zizmor.yml
          # Print the findings; do not upload them to code scanning.
          advanced-security: false
