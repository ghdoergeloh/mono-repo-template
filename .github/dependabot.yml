version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # New releases wait a week: most hijacked packages are found by then.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep @types/node on the Node.js major in .nvmrc
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7 is a new native compiler. Test all tools with it
      # before the upgrade.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"

  # Actions are pinned by commit SHA; Dependabot updates the SHA and the
  # version comment.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/tooling/github/setup"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"

  # The node base image in the Dockerfile is pinned by digest.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Keep the Node.js major of the image on the one in .nvmrc.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
