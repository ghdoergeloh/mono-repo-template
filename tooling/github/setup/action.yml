name: "Setup and install"
description: "Common setup steps for Actions"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"
        cache: pnpm

    # No global turbo install: pnpm derives the global bin dir by appending
    # /bin to PNPM_HOME, which pnpm/action-setup points at ".../node_modules/.bin".
    # The resulting ".../node_modules/.bin/bin" is not in PATH, so `pnpm add -g`
    # fails. It was redundant anyway — turbo is a root devDependency and every CI
    # step invokes it through a `pnpm <script>`, which resolves it locally.
    - shell: bash
      run: pnpm install --frozen-lockfile
